[project]
name = "boeiot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.6",
    "kagglehub>=1.0.1",
    "matplotlib>=3.10.9",
    "pandas>=3.0.2",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# Put the Lambda package on sys.path so tests can do `from detector import ...`
# using the same import path as the Lambda runtime sees inside its zip.
pythonpath = ["src/lambdas/anomaly_detector", "src/scripts"]
testpaths = ["tests"]
